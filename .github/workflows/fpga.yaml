name: fpga

# Builds the ULX3S 85F prototype bitstream: yosys -> nextpnr-ecp5 -> ecppack.
#
# This lives in CI rather than on the developer's PC on purpose: the 85F
# place-and-route is the slow step by a wide margin, and local heavy compute is
# off-limits on this project. `fpga/synth.ps1 -SynthOnly` is the local
# equivalent for a fast RTL check; it stops after yosys.
#
# The toolchain is PINNED to the same oss-cad-suite release installed on the
# development machine, so a CI cell count that disagrees with the local one
# means the DESIGN changed, not the tools.

on:
  push:
    paths:
      - 'src/**'
      - 'vendor/**'
      - 'fpga/**'
      - '.github/workflows/fpga.yaml'
  workflow_dispatch:

env:
  OSS_TAG: '2026-07-17'
  OSS_TARBALL: 'oss-cad-suite-linux-x64-20260717.tgz'

jobs:
  bitstream:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Runs FIRST, before the toolchain is even downloaded. Every failure it
      # catches is one nextpnr would either report ten minutes later or, worse,
      # not report at all (a LOCATE on the wrong ball builds perfectly).
      - name: pin constraints agree with the harness and the board
        run: python fpga/check_pins.py

      - name: cache oss-cad-suite
        id: cache-oss
        uses: actions/cache@v4
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-${{ env.OSS_TAG }}

      - name: install oss-cad-suite
        if: steps.cache-oss.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_TAG}/${OSS_TARBALL}"
          echo "downloading $url"
          curl -fL --retry 3 -o /tmp/oss-cad-suite.tgz "$url"
          tar -xzf /tmp/oss-cad-suite.tgz -C "$HOME"
          test -x "$HOME/oss-cad-suite/bin/nextpnr-ecp5"

      - name: put oss-cad-suite on PATH
        run: echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: tool versions
        run: |
          yosys -V
          nextpnr-ecp5 --version

      # The flash image, split into bram_cart's two byte lanes. Regenerated from
      # sw/game.bin rather than committed, so the bitstream cannot ship a copy
      # of the game that has drifted from the source.
      - name: build the flash image
        run: |
          mkdir -p fpga/build
          python tools/mkhex.py sw/game.bin fpga/build/game_lo.hex fpga/build/game_hi.hex

      # Source list comes from fpga/sources.txt — the same file synth.ps1
      # reads, so the two builders cannot drift apart. The DEFINES must match
      # synth.ps1's default too:
      #   SYNTHESIS   gates a simulation-only memory-zeroing loop that yosys
      #               would otherwise unroll 65536 times (a 6-minute build)
      #   CART_BRAM   memory in FPGA block RAM instead of the Cartridge Pmod
      #   BTN_ONBOARD controls on the board's buttons instead of the Gamepad Pmod
      # This is the no-Pmod console, which is the one that runs on the bench:
      # J1/J2 ship as bare holes.
      - name: synthesis (yosys)
        run: |
          src=$(grep -vE '^[[:space:]]*(#|$)' fpga/sources.txt | tr '\n' ' ')
          echo "sources: $src"
          yosys -l fpga/build/yosys.log \
            -p "read_verilog -sv -DSYNTHESIS -DCART_BRAM -DBTN_ONBOARD -I src $src; synth_ecp5 -top ulx3s_top -json fpga/build/console.json"

      # The Cartridge-Pmod / Gamepad-Pmod build is no longer the default, so
      # nothing else would ever compile those branches and they would rot
      # silently until the day someone solders headers on. Synthesis only, no
      # place-and-route: it costs under a minute and catches the whole class of
      # failure that matters here (an `else` branch that no longer elaborates).
      - name: the Pmod variant still synthesises
        run: |
          src=$(grep -vE '^[[:space:]]*(#|$)' fpga/sources.txt | tr '\n' ' ')
          yosys -l fpga/build/yosys-pmod.log \
            -p "read_verilog -sv -DSYNTHESIS -I src $src; synth_ecp5 -top ulx3s_top -json fpga/build/console-pmod.json"

      # nextpnr fails by design when the 25 MHz constraint in fpga/ulx3s.lpf is
      # not met. Capture its exit code instead of letting the step die, so the
      # achieved Fmax still reaches the summary and the artifact on a red run —
      # "how far off were we" is the whole point of the number.
      - name: place and route (nextpnr-ecp5)
        id: pnr
        run: |
          set +e
          set -o pipefail
          nextpnr-ecp5 --85k --package CABGA381 \
            --json fpga/build/console.json \
            --lpf fpga/ulx3s.lpf \
            --textcfg fpga/build/console.config 2>&1 | tee fpga/build/nextpnr.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: pack bitstream (ecppack)
        if: steps.pnr.outputs.rc == '0'
        run: |
          ecppack fpga/build/console.config fpga/build/console.bit
          ls -l fpga/build/console.bit

      - name: report
        if: always()
        run: |
          set +e
          {
            echo "## Console prototype — ULX3S 85F (LFE5U-85F, CABGA381)"
            echo
            echo "### Logic"
            echo '```'
            # The rows that matter are TRELLIS_COMB/TRELLIS_FF, and they sit
            # near the END of nextpnr's utilisation table — a short -A window
            # silently cuts off exactly the two numbers a human wants.
            grep -E "Total LUT4s|TRELLIS_COMB|TRELLIS_FF|TRELLIS_IO|DP16KD|MULT18X18D|CCU2C" fpga/build/nextpnr.log | head -12
            echo '```'
            echo "### Timing (constraint: 25 MHz, from fpga/ulx3s.lpf)"
            # nextpnr prints "Max frequency" TWICE and they are NOT the same
            # measurement: once right after placement, using ESTIMATED wire
            # delays, and again after routing, using the real ones. Only the
            # second is the answer. On this design they differ by ~10 MHz, the
            # placement estimate being the pessimistic one — and an unlabelled
            # grep of both is exactly how the wrong number ends up quoted in a
            # README. So label them, and put the post-route one first.
            nfreq=$(grep -c "Max frequency for clock" fpga/build/nextpnr.log)
            post_place=$(grep "Max frequency for clock" fpga/build/nextpnr.log | head -1 | sed 's/.*IN.: //')
            post_route=$(grep "Max frequency for clock" fpga/build/nextpnr.log | tail -1 | sed 's/.*IN.: //')
            if [ "$nfreq" -ge 2 ]; then
              echo "**Post-route Fmax — THIS is the number to quote: \`$post_route\`**"
              echo
              echo "<sub>Post-*placement* estimate (before routing, pessimistic, do NOT quote): \`$post_place\`</sub>"
            elif [ "$nfreq" -eq 1 ]; then
              echo "**Only a post-placement estimate exists — routing did not complete:** \`$post_place\`"
            else
              echo "_nextpnr reported no clock frequency at all._"
            fi
            echo
            echo "<details><summary>critical path and cross-domain delays</summary>"
            echo
            echo '```'
            grep -E "Max delay|Info: Critical path" fpga/build/nextpnr.log | head -20
            echo '```'
            echo
            echo "</details>"
            if [ "${{ steps.pnr.outputs.rc }}" != "0" ]; then
              echo "**nextpnr exited ${{ steps.pnr.outputs.rc }}** — see the full log in the artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-fpga
          path: |
            fpga/build/console.bit
            fpga/build/yosys.log
            fpga/build/nextpnr.log
          if-no-files-found: warn

      - name: gate on place-and-route result
        run: |
          if [ "${{ steps.pnr.outputs.rc }}" != "0" ]; then
            echo "::error::nextpnr-ecp5 exited ${{ steps.pnr.outputs.rc }}. If this is a timing violation, the achieved Fmax is in the job summary and in fpga/build/nextpnr.log in the console-fpga artifact."
            exit 1
          fi

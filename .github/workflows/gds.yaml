name: gds

# The 8x2 harden is a multi-HOUR job, so it is scoped to `main` rather than
# running on every push to every branch (the stock template default).
# Feature branches like the ULX3S/FPGA work change the harness, the tests and
# the docs without touching what the ASIC flow builds at all, and each of
# those pushes was starting a full harden that could not tell you anything.
#
# UPDATE 2026-08-02: the console is an FPGA project and is NOT taping out (user
# directive), so even `main` should not auto-start a harden. The 8x2 harden wall
# (DPL-0036 hold-buffer flood) is parked, not fixed — auto-running it on every
# push to main spends hours of CI to re-derive a red badge nobody is acting on,
# and makes main look broken when the thing main actually ships is a bitstream.
# The flow is kept intact and one keystroke away, because the ASIC shape is a
# possible future project, just not the current one.
#
# Run one whenever you actually want it:
#     gh workflow run gds.yaml --ref <branch>
on:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26c
        with:
          pdk: sky130A

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26c

  # gl_test and viewer are intentionally omitted for now:
  #   * gl_test needs the standard TT test/tb.v + test.py gate-level harness;
  #     this project's test/ is a custom per-block cocotb suite (tb_boot.v,
  #     tb_soc.v, ...), so a GL wrapper has to be written first.
  #   * viewer deploys the die viewer to GitHub Pages, which must be enabled on
  #     the repo by hand first (see the tt-riscv lesson). Add once gds is green.

name: test

on:
  push:
  workflow_dispatch:

jobs:
  sim:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Keep this list in sync with SUITES in test/run.py — a suite that
        # exists there but not here passes forever on the developer's machine
        # and is never checked by anyone else.
        #   chip blocks:
        block: [snes, vga, twin, qspi, arb, vfetch, vengine, audio, soc, cpuadapt, boot,
        #   ULX3S harness blocks (no silicon pin exists for these):
                sdspi, spiflash, sdload, gamepad,
        #   full chain: real sw/game.bin -> card image -> loader -> flash -> XIP boot
                rehearse,
        #   ulx3s_top itself, through the physical header pins: the Pmod row
        #   permutations, the SW1/SW2/SW3 straps and the bus mux
                fpga]
    steps:
      - uses: actions/checkout@v4

      - name: install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install python deps
        run: pip install -r test/requirements.txt

      - name: run ${{ matrix.block }}
        working-directory: test
        run: python run.py ${{ matrix.block }}

      - name: check results
        working-directory: test
        run: |
          test -f results_${{ matrix.block }}.xml
          ! grep -q '<failure' results_${{ matrix.block }}.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.block }}
          path: test/results_*.xml

  # Host-side tools. These are not gateware and need no simulator, but they
  # are the only things that touch a real card, and a mistake in them shows
  # up as an LED code that blames the card instead of the writer.
  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install pytest
        run: pip install pytest

      - name: sdwrite device-targeting rules
        run: python -m pytest tools/test_sdwrite.py -v

  # The Windows host this project is developed on has no `make`, so the
  # Makefile can only be verified here. It runs the twin suite, which is
  # the one with a build step (the netlist module rename) in front of it.
  make:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install python deps
        run: pip install -r test/requirements.txt

      - name: make BLOCK=twin
        working-directory: test
        run: make BLOCK=twin

      - name: check results
        working-directory: test
        run: |
          test -f results.xml
          ! grep -q '<failure' results.xml
